[project]
name = "chat"
version = "0.1.0"
description = "Comrux chat service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "cryptography>=46.0.3",
    "dishka>=1.7.2",
    "fastapi>=0.115.0",
    "faststream[kafka]>=0.5.48",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.10.1",
    "pyjwt>=2.10.1",
    "redis>=6.4.0",
    "sqlalchemy>=2.0.41",
    "uvicorn[standart]>=0.35.0",
    "websockets>=16.0",
    "wsproto>=1.3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.12.10",
]


[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
